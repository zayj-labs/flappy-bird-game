<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Air Force 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        #gameContainer {
            position: relative;
            width: 400px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            border: 3px solid #333;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #shoe {
            position: absolute;
            width: 50px;
            height: 40px;
            left: 50px;
            top: 250px;
            z-index: 10;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: scaleX(-1) rotate(-20deg);
        }

        .pipe {
            position: absolute;
            width: 60px;
            background: #228B22;
            border: 2px solid #1a6b1a;
        }

        .pipe-top {
            top: 0;
            border-bottom: 8px solid #1a6b1a;
        }

        .pipe-bottom {
            bottom: 0;
            border-top: 8px solid #1a6b1a;
        }

        .obstacle {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #FF6B6B;
            border: 2px solid #CC5555;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
        }

        .obstacle.spike {
            background: #FFD700;
            border-color: #FFA500;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        .obstacle.bomb {
            background: #333;
            border-radius: 50%;
            border-color: #000;
        }

        .obstacle.block {
            background: #8B4513;
            border-color: #654321;
        }

        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #333;
            z-index: 20;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
        }

        #gameOverScreen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 30;
        }

        #gameOverScreen.show {
            display: flex;
        }

        #gameOverText {
            font-size: 60px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #finalScore {
            font-size: 36px;
            color: white;
            margin-bottom: 30px;
        }

        #restartBtn {
            padding: 15px 40px;
            font-size: 24px;
            background: #FFD700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #333;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        #restartBtn:hover {
            background: #FFA500;
            transform: scale(1.05);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 20;
        }

        #difficulty {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 15px;
            border-radius: 5px;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="shoe">👟</div>
        <div id="score">Score: 0</div>
        <div id="difficulty">Level: 1</div>
        <div id="gameOverScreen">
            <div id="gameOverText">GAME OVER</div>
            <div id="finalScore">Final Score: 0</div>
            <button id="restartBtn">Restart Game</button>
        </div>
        <div id="instructions">
            SPACEBAR to Jump
        </div>
    </div>

    <script>
        // Game variables
        const gameContainer = document.getElementById('gameContainer');
        const shoe = document.getElementById('shoe');
        const scoreDisplay = document.getElementById('score');
        const difficultyDisplay = document.getElementById('difficulty');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreDisplay = document.getElementById('finalScore');
        const restartBtn = document.getElementById('restartBtn');

        let shoeY = 250;
        let shoeX = 50;
        let velocity = 0;
        const gravity = 0.4;
        const jumpStrength = -10;
        let score = 0;
        let gameOver = false;
        let gameSpeed = 3;
        const pipeGap = 150;
        const pipeWidth = 60;
        let pipeSpawnRate = 100;
        let pipeCounter = 0;
        let obstacleSpawnRate = 180;
        let obstacleCounter = 0;
        let level = 1;

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!gameOver) {
                    velocity = jumpStrength;
                }
            }
        });

        // Restart button
        restartBtn.addEventListener('click', restartGame);

        function restartGame() {
            shoeY = 250;
            velocity = 0;
            score = 0;
            gameOver = false;
            pipeCounter = 0;
            obstacleCounter = 0;
            gameSpeed = 3;
            level = 1;
            pipeSpawnRate = 100;
            obstacleSpawnRate = 180;
            scoreDisplay.textContent = `Score: ${score}`;
            difficultyDisplay.textContent = `Level: ${level}`;
            gameOverScreen.classList.remove('show');
            
            // Remove all obstacles
            document.querySelectorAll('.pipe, .obstacle').forEach(element => element.remove());
            
            gameLoop();
        }

        function updateShoe() {
            if (!gameOver) {
                velocity += gravity;
                shoeY += velocity;

                // Check boundaries
                if (shoeY <= 0) {
                    shoeY = 0;
                    velocity = 0;
                }
                if (shoeY + 40 >= 600) {
                    endGame();
                }
            }

            shoe.style.top = shoeY + 'px';
        }

        function spawnPipe() {
            if (pipeCounter >= pipeSpawnRate) {
                const topPipeHeight = Math.random() * (200 - 50) + 50;
                const bottomPipeHeight = 600 - topPipeHeight - pipeGap;

                // Top pipe
                const topPipe = document.createElement('div');
                topPipe.className = 'pipe pipe-top';
                topPipe.style.height = topPipeHeight + 'px';
                topPipe.style.left = gameContainer.clientWidth + 'px';
                gameContainer.appendChild(topPipe);

                // Bottom pipe
                const bottomPipe = document.createElement('div');
                bottomPipe.className = 'pipe pipe-bottom';
                bottomPipe.style.height = bottomPipeHeight + 'px';
                bottomPipe.style.left = gameContainer.clientWidth + 'px';
                gameContainer.appendChild(bottomPipe);

                pipeCounter = 0;
            } else {
                pipeCounter++;
            }
        }

        function spawnObstacle() {
            if (obstacleCounter >= obstacleSpawnRate) {
                const obstacleTypes = ['spike', 'bomb', 'block'];
                const randomType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
                const randomY = Math.random() * (500 - 50) + 50;

                const obstacle = document.createElement('div');
                obstacle.className = `obstacle ${randomType}`;
                obstacle.style.left = gameContainer.clientWidth + 'px';
                obstacle.style.top = randomY + 'px';
                
                if (randomType === 'spike') {
                    obstacle.textContent = '⭐';
                } else if (randomType === 'bomb') {
                    obstacle.textContent = '💣';
                } else {
                    obstacle.textContent = '■';
                }
                
                gameContainer.appendChild(obstacle);
                obstacleCounter = 0;
            } else {
                obstacleCounter++;
            }
        }

        function moveObstacles() {
            const obstacles = document.querySelectorAll('.pipe, .obstacle');
            obstacles.forEach((element) => {
                let elementX = parseFloat(element.style.left);
                elementX -= gameSpeed;
                element.style.left = elementX + 'px';

                // Remove when off screen
                if (elementX < -pipeWidth - 50) {
                    element.remove();
                }

                // Score when passing pipe
                if (element.classList.contains('pipe-top') && elementX === shoeX - pipeWidth && !gameOver) {
                    score++;
                    scoreDisplay.textContent = `Score: ${score}`;
                    
                    // SLOW increase in difficulty - every 10 points
                    if (score % 10 === 0) {
                        level = Math.floor(score / 10) + 1;
                        // Very minimal speed increase (0.2 per level instead of 0.5)
                        gameSpeed = 3 + (level - 1) * 0.2;
                        // Slightly reduce spawn rate (obstacles come a bit more frequent)
                        pipeSpawnRate = Math.max(90, 100 - (level - 1) * 2);
                        obstacleSpawnRate = Math.max(160, 180 - (level - 1) * 3);
                        difficultyDisplay.textContent = `Level: ${level}`;
                    }
                }
            });
        }

        function checkCollisions() {
            const allObstacles = document.querySelectorAll('.pipe, .obstacle');
            const shoeRect = shoe.getBoundingClientRect();

            allObstacles.forEach(element => {
                const elementRect = element.getBoundingClientRect();
                
                if (shoeRect.left < elementRect.right &&
                    shoeRect.right > elementRect.left &&
                    shoeRect.top < elementRect.bottom &&
                    shoeRect.bottom > elementRect.top) {
                    endGame();
                }
            });
        }

        function endGame() {
            gameOver = true;
            finalScoreDisplay.textContent = `Final Score: ${score} (Level ${level})`;
            gameOverScreen.classList.add('show');
        }

        function gameLoop() {
            if (!gameOver) {
                updateShoe();
                spawnPipe();
                spawnObstacle();
                moveObstacles();
                checkCollisions();
            }
            requestAnimationFrame(gameLoop);
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
